<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Распределение ёмкости команды в первом спринте</title>
  <desc id="desc">Из 264 человеко-часов 178 часов запланированы на задачи спринта и обучение, 66 часов — на коммуникацию и организационные расходы, 20 часов — технический резерв.</desc>
  <rect width="1200" height="520" fill="#ffffff"/>

  <text x="72" y="82" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#172033">
    Ёмкость команды в первом спринте
  </text>
  <text x="72" y="122" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#5b6475">
    Всего 264 человеко-часа на две недели
  </text>

  <defs>
    <clipPath id="barClip">
      <rect x="72" y="180" width="1056" height="112" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#barClip)">
    <rect x="72" y="180" width="712" height="112" fill="#2563eb"/>
    <rect x="784" y="180" width="264" height="112" fill="#f59e0b"/>
    <rect x="1048" y="180" width="80" height="112" fill="#16a34a"/>
  </g>

  <text x="428" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff">178 ч</text>
  <text x="428" y="259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff">67,4%</text>
  <text x="916" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#172033">66 ч</text>
  <text x="916" y="259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172033">25%</text>
  <text x="1088" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">20</text>
  <text x="1088" y="257" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#ffffff">7,6%</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="72" y="348" width="22" height="22" rx="4" fill="#2563eb"/>
    <text x="108" y="366" font-size="22" fill="#172033">Задачи спринта и обучение — 178 ч</text>

    <rect x="72" y="399" width="22" height="22" rx="4" fill="#f59e0b"/>
    <text x="108" y="417" font-size="22" fill="#172033">Коммуникация и организационные расходы — 66 ч</text>

    <rect x="72" y="450" width="22" height="22" rx="4" fill="#16a34a"/>
    <text x="108" y="468" font-size="22" fill="#172033">Технический резерв — 20 ч</text>
  </g>
</svg>
